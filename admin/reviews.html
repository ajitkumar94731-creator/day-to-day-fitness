<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin – Customer Reviews</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><img src="../assets/logo/logo.png" alt="Day to Day Fitness" /></div>
        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="members.html">Members</a></li>
            <li><a href="reviews.html" class="active">Reviews</a></li>
            <!-- other admin links omitted for brevity -->
        </ul>
        <div class="menu-toggle"><i class="fas fa-bars"></i></div>
    </nav>

    <section class="content-section" style="padding:2rem; max-width:1200px; margin:auto;">
        <h1>Customer Reviews Management</h1>
        <div style="margin-bottom:1rem; display:flex; gap:0.5rem; align-items:center;">
            <input type="text" id="search" placeholder="Search reviews..." style="padding:0.4rem; flex:1;" />
            <select id="filterStatus" style="padding:0.4rem;">
                <option value="all">All</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
            </select>
        </div>
        <div id="reviewsContainer" class="card-grid"></div>
    </section>

    <footer class="footer">
        <div class="footer-columns">
            <div class="footer-col"><h3>Day to Day Fitness</h3><p>Admin Panel</p></div>
        </div>
        <div class="footer-bottom"><p>&copy; 2026 Day to Day Fitness.</p></div>
    </footer>

    <script type="module" src="../js/admin-reviews.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
